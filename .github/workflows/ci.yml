name: CHAPAREFORMES CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linters
      run: npm run lint

    - name: Check TypeScript Types
      run: npx tsc --noEmit

    - name: Build Next.js
      run: npm run build
      env:
        # Esto prevendrá que falle si no tiene algunas variables de entorno no críticas
        NEXT_TELEMETRY_DISABLED: 1
